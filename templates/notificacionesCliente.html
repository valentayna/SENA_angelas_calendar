<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tus Notificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/stylesCliente.css">
  </head>
  <body class="app-bg">
    <div class="d-flex vh-100 overflow-hidden">
        <aside class="sidebar d-none d-lg-flex flex-column align-items-start p-4">
            <div class="brand-small">ANGELA'S <br><span class="brand mb-4">CALENDAR</span></div>
            <nav class="nav flex-column w-100" style="padding-top: 100px;">
                <a class="nav-link" href="homeCliente.html"> <i class="bi bi-house-door-fill"></i> Inicio</a>
                <a class="nav-link" href="citasCliente.html"> <i class="bi bi-calendar"></i> Citas</a>
                <a class="nav-link text-danger" href="notificacionesCliente.html"> <i class="bi bi-chat-right-dots-fill"></i> Notificación</a>
                <a class="nav-link" href="usuarioCliente.html"> <i class="bi bi-person-fill"></i> Usuario</a>
            </nav>
            <div class="mt-auto w-100">
                <a class="nav-link text-muted" href="#"> <i class="bi bi-door-open-fill"></i> Salir</a>
            </div>
        </aside>

      <main class="flex-fill overflow-auto p-4">
        <div class="container-fluid">
          <div class="row mb-3">
            <div class="col-12 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link d-lg-none p-0 fs-3"><i class="bi bi-list"></i></button>
                <h2 class="m-0 title">Tus notificaciones</h2>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-lg-10">
              <div class="white-panel p-4 rounded-4">
                <button class="btn btn-teal mb-4">Vaciar buzón</button>

                <div class="notifications-list">
                  <div class="notif-item d-flex align-items-center justify-content-between mb-3 p-3">
                    <div>
                      <div class="notif-date small text-muted">18/07/2025 - 08:00</div>
                      <div class="notif-text">Tienes una cita mañana</div>
                    </div>
                    <div class="notif-close">x</div>
                  </div>

                  <div class="notif-item d-flex align-items-center justify-content-between mb-3 p-3">
                    <div>
                      <div class="notif-date small text-muted">08/07/2025 - 23:10</div>
                      <div class="notif-text">Haz eliminado una cita</div>
                    </div>
                    <div class="notif-close">x</div>
                  </div>

                  <div class="notif-item d-flex align-items-center justify-content-between mb-3 p-3">
                    <div>
                      <div class="notif-date small text-muted">08/07/2025 - 09:00</div>
                      <div class="notif-text">Haz modificado una cita</div>
                    </div>
                    <div class="notif-close">x</div>
                  </div>

                  <div class="notif-item d-flex align-items-center justify-content-between mb-3 p-3">
                    <div>
                      <div class="notif-date small text-muted">05/07/2025 - 16:30</div>
                      <div class="notif-text">Haz agendado una cita</div>
                    </div>
                    <div class="notif-close">x</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
